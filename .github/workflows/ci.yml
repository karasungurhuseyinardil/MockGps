name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend + database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: RLS tests (pgTAP)
        run: supabase test db
      - name: Export local keys for integration tests
        run: |
          supabase status -o env > .supabase.env
          set -a; source .supabase.env; set +a
          {
            echo "MOCKGPS_TEST_SUPABASE_URL=$API_URL"
            echo "MOCKGPS_TEST_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "MOCKGPS_TEST_SECRET_KEY=$SECRET_KEY"
            echo "MOCKGPS_TEST_JWT_SECRET=$JWT_SECRET"
            echo "MOCKGPS_TEST_DATABASE=Host=127.0.0.1;Port=54322;Database=postgres;Username=postgres;Password=postgres"
          } >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build backend/MockGps.sln -c Release
      - name: Unit + integration tests
        run: dotnet test backend/MockGps.sln -c Release --no-build --logger "trx" --results-directory backend/TestResults
      - name: Docker image builds
        run: docker build -t mockgps-api:ci backend

  web:
    name: Website + admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (site pre-render + admin)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_SITE_URL: https://mockgps.example.com
          VITE_SUPABASE_URL: https://project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  mobile:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Kotlin unit tests (route player)
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Release APK builds
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=https://api.example.com
          --dart-define=SUPABASE_URL=https://project.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
